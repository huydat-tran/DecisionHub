<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login-and-theme</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/signup.css">
    <script>
        const theme = localStorage.getItem("selectedTheme");
        if (theme === "dark") {
            document.documentElement.setAttribute("data-theme", "dark");
        }
    </script>
</head>
<body id="main">
    <div class="theme-toggle">
        <button type="button" class="theme-btn" id="themeToggleBtn" onclick="toggleTheme()">
            <i class="fas fa-moon"></i>
        </button>
    </div>

    <div class="main-wrapper" id="mainContainer">
        <div class="animated-circle"></div>
        
        <div class="content-wrapper">
            <div class="forms-section">
                <form class="auth-form login-form" id="loginForm">
                    <h2 class="form-heading">Sign In</h2>

                    <div class="field-wrap">
                        <div class="field-container">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="loginEmail" placeholder="Email" autocomplete="email"
                                aria-describedby="loginEmailError">
                            <span></span>
                        </div>
                        <p class="field-error" id="loginEmailError" aria-live="polite"></p>
                    </div>

                    <div class="field-wrap">
                        <div class="field-container">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="loginPass" placeholder="Password" autocomplete="current-password"
                                aria-describedby="loginPassError">
                            <i class="far fa-eye eye-icon" onclick="togglePasswordVisibility('loginPass', this)"></i>
                        </div>
                        <p class="field-error" id="loginPassError" aria-live="polite"></p>
                    </div>

                    <p class="form-alert" id="loginAlert" role="alert"></p>

                    <a href="#" class="text-link">Forgot your password?</a>

                    <button type="submit" class="action-button">Login</button>

                    
                </form>

                <form class="auth-form signup-form" id="signupForm">
                    <h2 class="form-heading">Create Account</h2>

                    <div class="field-wrap">
                        <div class="field-container">
                            <i class="fas fa-user"></i>
                            <input type="text" id="signupUsername" placeholder="Username" autocomplete="username"
                                aria-describedby="signupUsernameError">
                            <span></span>
                        </div>
                        <p class="field-error" id="signupUsernameError" aria-live="polite"></p>
                    </div>

                    <div class="field-wrap">
                        <div class="field-container">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="signupEmail" placeholder="Email" autocomplete="email"
                                aria-describedby="signupEmailError">
                            <span></span>
                        </div>
                        <p class="field-error" id="signupEmailError" aria-live="polite"></p>
                    </div>

                    <div class="field-wrap">
                        <div class="field-container">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="signupPass" placeholder="Password" autocomplete="new-password"
                                aria-describedby="signupPassError">
                            <i class="far fa-eye eye-icon" onclick="togglePasswordVisibility('signupPass', this)"></i>
                        </div>
                        <p class="field-error" id="signupPassError" aria-live="polite"></p>
                    </div>

                    <div class="terms-check">
                        <input type="checkbox" id="acceptTerms">
                        <label for="acceptTerms">I accept the <a href="#">terms and conditions</a></label>
                    </div>

                    <p class="form-alert" id="signupAlert" role="alert"></p>

                    <button type="submit" class="action-button">Sign Up</button>

                    
                </form>
            </div>
        </div>

        <div class="side-panels">
            <div class="info-panel left-info">
                <div class="panel-content">
                    <h3>Don't have an account?</h3>
                    <p>Create your account now to follow people and like publications</p>
                    <button class="transparent-btn" onclick="switchToRegister()">Sign Up</button>
                </div>
                
            </div>

            <div class="info-panel right-info">
                <div class="panel-content">
                    <h3>Already have an account?</h3>
                    <p>Sign in to see your notifications and post your favorite photos</p>
                    <button class="transparent-btn" onclick="switchToLogin()">Sign In</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Thứ tự quan trọng: axios -> config -> api -> utils -> sweetalert2 -> script riêng của trang -->
    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.all.min.js"></script>
    <script src="../js/pages/signup.js"></script>
</body>
</html>
