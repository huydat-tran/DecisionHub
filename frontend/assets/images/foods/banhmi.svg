<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <rect width="160" height="160" rx="20" fill="#FFFBEB"/>
  <!-- Ổ bánh mì vàng giòn -->
  <g transform="rotate(-18 80 80)">
    <!-- Bóng bánh mì -->
    <ellipse cx="80" cy="98" rx="60" ry="14" fill="#E5E7EB" opacity="0.6"/>
    <!-- Vỏ bánh mì dưới -->
    <path d="M22,80 C22,65 50,60 80,60 C110,60 138,65 138,80 C138,98 110,102 80,102 C50,102 22,98 22,80 Z" fill="#D97706"/>
    <!-- Nhân pate & sốt bơ -->
    <path d="M26,80 C50,78 110,78 134,80" stroke="#78350F" stroke-width="8" stroke-linecap="round"/>
    <path d="M30,82 C55,81 105,81 130,82" stroke="#FBBF24" stroke-width="4" stroke-linecap="round"/>
    <!-- Thịt xá xíu / chả lụa -->
    <ellipse cx="48" cy="79" rx="10" ry="4.5" fill="#EF4444"/>
    <ellipse cx="72" cy="78" rx="12" ry="5" fill="#F87171"/>
    <ellipse cx="98" cy="79" rx="11" ry="4.5" fill="#EF4444"/>
    <ellipse cx="118" cy="79" rx="9" ry="4" fill="#F87171"/>
    <!-- Dưa chuột & rau mùi xanh tươi -->
    <rect x="56" y="74" width="20" height="4" rx="2" fill="#22C55E"/>
    <rect x="86" y="75" width="22" height="4" rx="2" fill="#16A34A"/>
    <!-- Cà rốt đồ chua sợi -->
    <path d="M40,77 L62,83 M80,77 L98,82 M108,76 L124,80" stroke="#FB923C" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Vỏ bánh mì trên nướng vàng rộm -->
    <path d="M22,76 C22,54 50,46 80,46 C110,46 138,54 138,76 C138,80 110,82 80,82 C50,82 22,80 22,76 Z" fill="#F59E0B" stroke="#B45309" stroke-width="2.5"/>
    <!-- Khía rạch giòn trên lưng bánh mì -->
    <path d="M48,58 Q54,64 60,62" fill="none" stroke="#78350F" stroke-width="3" stroke-linecap="round"/>
    <path d="M75,55 Q81,61 87,59" fill="none" stroke="#78350F" stroke-width="3" stroke-linecap="round"/>
    <path d="M102,58 Q108,64 114,62" fill="none" stroke="#78350F" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
