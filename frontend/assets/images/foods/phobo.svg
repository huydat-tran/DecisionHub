<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <rect width="160" height="160" rx="20" fill="#F4F8F6"/>
  <!-- Đế bát phở -->
  <ellipse cx="80" cy="130" rx="40" ry="12" fill="#E2E8F0"/>
  <!-- Thân bát tô sứ -->
  <path d="M25,65 C28,115 50,132 80,132 C110,132 132,115 135,65 Z" fill="#FFFFFF" stroke="#0D9488" stroke-width="3"/>
  <ellipse cx="80" cy="65" rx="55" ry="22" fill="#E6FFFA" stroke="#0D9488" stroke-width="2.5"/>
  <!-- Nước dùng trong veo óng ánh -->
  <ellipse cx="80" cy="67" rx="50" ry="18" fill="#B45309" opacity="0.35"/>
  <!-- Bánh phở trắng -->
  <path d="M42,66 Q65,60 88,68 T120,65" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M46,71 Q70,66 94,73" fill="none" stroke="#F8FAFC" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Thịt bò tái mỏng mềm hồng hào -->
  <ellipse cx="62" cy="62" rx="14" ry="8" fill="#BE123C" transform="rotate(-15 62 62)"/>
  <ellipse cx="78" cy="58" rx="13" ry="7" fill="#9F1239" transform="rotate(10 78 58)"/>
  <ellipse cx="96" cy="63" rx="14" ry="8" fill="#BE123C" transform="rotate(-5 96 63)"/>
  <!-- Hành lá, rau mùi xanh ngát -->
  <circle cx="55" cy="72" r="3" fill="#16A34A"/>
  <circle cx="68" cy="74" r="2.5" fill="#22C55E"/>
  <circle cx="85" cy="72" r="3" fill="#15803D"/>
  <circle cx="102" cy="70" r="2.5" fill="#22C55E"/>
  <circle cx="112" cy="65" r="3" fill="#16A34A"/>
  <!-- Hành tây cắt lát mỏng -->
  <path d="M70,68 Q80,63 90,68" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.85"/>
  <!-- Lát chanh & ớt -->
  <polygon points="50,56 55,54 53,59" fill="#DC2626"/>
  <!-- Đôi đũa gác ngang bát -->
  <line x1="30" y1="48" x2="135" y2="40" stroke="#78350F" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Khói nóng bốc lên ngun ngút -->
  <path d="M68,36 Q62,26 68,16" fill="none" stroke="#0D9488" stroke-width="2" stroke-linecap="round" opacity="0.45"/>
  <path d="M82,34 Q88,24 82,14" fill="none" stroke="#0D9488" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  <path d="M96,36 Q90,26 96,16" fill="none" stroke="#0D9488" stroke-width="2" stroke-linecap="round" opacity="0.45"/>
</svg>
